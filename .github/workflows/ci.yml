name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apex-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Preview smoke (production bundle renders)
        run: |
          npm run preview > /tmp/preview.log 2>&1 &
          sleep 6
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null 2>&1 && npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1 || true
          cd /tmp/pw && node $GITHUB_WORKSPACE/apex-engine/scripts/preview-smoke.mjs
